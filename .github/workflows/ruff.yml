name: Ruff

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  ruff:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python_version: "3.13"

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install ruff

        - name: Run Ruff
          run: |
            ruff check .

        - name: Check formatting
          run: |
            ruff format . --check --diff
            
