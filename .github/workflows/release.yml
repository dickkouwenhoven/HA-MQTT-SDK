# .github/workflows/release.yml
#
# Triggered when a version tag is pushed (e.g. v0.4.0).
#
# Pipeline:
#   1. Run full CI (lint, type check, tests) to verify the tag is clean
#   2. Extract the release notes for this version from CHANGELOG.md
#   3. Build the Python distribution (sdist + wheel)
#   4. Create a GitHub Release with the extracted notes and built artifacts
#   5. Publish the package to PyPI
#
# Required repository secrets:
#   PYPI_API_TOKEN  — API token from https://pypi.org/manage/account/token/
#
# How to trigger:
#   git tag v0.4.0
#   git push origin v0.4.0

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # matches v0.4.0, v1.0.0, etc.

permissions:
  contents: write   # needed to create GitHub Release

jobs:

  # ── 1. Verify the tag is clean ─────────────────────────────────────────────

  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format . --check --diff

      - name: Type check
        run: mypy src/ha_mqtt_sdk

      - name: Run tests
        run: |
          pytest \
            --cov=ha_mqtt_sdk \
            --cov-report=term-missing \
            --cov-fail-under=100 \
            -v

  # ── 2. Extract release notes from CHANGELOG.md ────────────────────────────

  changelog:
    name: Extract changelog
    runs-on: ubuntu-latest
    needs: verify

    outputs:
      release_notes: ${{ steps.extract.outputs.release_notes }}
      version: ${{ steps.extract.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG.md
        id: extract
        run: |
          VERSION="${{ steps.tag.outputs.version }}"

          # Extract the block between ## [VERSION] and the next ## [
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "ERROR: No changelog entry found for version $VERSION"
            exit 1
          fi

          # Write to file to preserve multiline content
          echo "$NOTES" > release_notes.txt

          # Pass to output using GitHub's multiline delimiter
          {
            echo "release_notes<<RELEASE_NOTES_EOF"
            cat release_notes.txt
            echo "RELEASE_NOTES_EOF"
          } >> $GITHUB_OUTPUT

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.txt

  # ── 3. Build distribution ─────────────────────────────────────────────────

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution contents
        run: |
          pip install twine
          twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 4. Create GitHub Release ──────────────────────────────────────────────

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [changelog, build]

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ needs.changelog.outputs.version }}"
          body: ${{ needs.changelog.outputs.release_notes }}
          files: dist/*
          draft: false
          prerelease: false

  # ── 5. Publish to PyPI ────────────────────────────────────────────────────

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release

    environment:
      name: pypi
      url: https://pypi.org/project/ha_mqtt_sdk/

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
